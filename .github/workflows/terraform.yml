name: Terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate
        run: |
          for stack in env/prod bootstrap/github-oidc; do
            echo "::group::$stack"
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
            echo "::endgroup::"
          done
      - name: Lint
        run: |
          tflint --init
          tflint --recursive --format compact
      - name: Checkov
        run: pipx run --spec checkov==3.4.3 checkov --config-file .checkov.yaml
